# foundry-cip — Product-root capabilities.yaml
# Per JOS-SPEC-011 v1.1. Each capability = one of the 8 pillars locked per D-117.
# Granular features live in features.yaml (tagged by pillar:<slug>).
#
# MATURITY RE-GRADE 2026-09-04. Every grade below is now measured against an industry
# benchmark rather than self-asserted, and each carries maturity_evidence. Before this,
# no maturity: value had changed since 2026-05-21 -- they predated 262 commits and 156
# migrations. Four moved DOWN (ingestion, structured-store, lens-engine, access-and-ops);
# four were already bronze and are confirmed. Two pillars are GATING (structured-store,
# access-and-operations), so CIP overall is BRONZE. The grading rule applied: a level
# claimed without a citable artifact is regraded to the highest level that has one.

declared_thing: foundry-cip
parent: foundry-studio
last_modified: 2026-09-05
last_reviewed: 2026-09-04
review_cadence: 90

capabilities:
  - capability_id: CIP-CAP-001
    title: Ingest Client Data from External Sources
    summary: Pull a venture's data from CRM, support, financial, and document systems into CIP automatically.
    description: |
      Connector framework + concrete connectors (FixtureConnector, HubSpot, Zendesk;
      Plaid planned). Every connector implements CIPConnector + CIPMapper Protocols,
      backfills source-system history on first sync (D-159), and passes the
      8-test conformance harness.
    status: shipped
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      164 sync runs stuck in 'running' (161 >24h, back to 2026-06-10); no reaper exists.
      No dead-letter/quarantine for bad records. Schema drift is counted but never alerted,
      and collapses into rows_skipped so it is not separable after the fact. features.yaml
      omits 4 live production feeds (Stripe, LensMirror, Slack brand-connections, signal harvest).
      Bronze criteria all met: durable run ledger, backoff with Retry-After, durable cursor,
      idempotent writes, advisory-lock dual-run prevention. Measured 2026-09-04.
    created: 2026-04-17
    last_modified: 2026-05-14
    shipped_date: 2026-04-30
    owner: tim
    domain: eng
    audience: [internal-team, agent]
    composed_of_features:
      - connector-framework
      - fixture-connector
      - hubspot-connector
      - zendesk-connector
      - plaid-connector
      - historical-backfill
      - connector-conformance-harness
    value_delivered: A new tenant onboards in hours, not weeks; source history captured on first sync; framework gates schema drift before it lands in production.
    consumer_workflows:
      - new-tenant-onboard: Operator drops connector config + runs FixtureConnector or real connector; data flows into cip_* tables with provenance.
      - bug-bash: Every connector passes the conformance harness before Wayward exposure.
    tags: [pillar:ingestion-and-connectors]
    references:
      - id: D-117
        relationship: ratified-by
      - id: D-134
        relationship: implements

  - capability_id: CIP-CAP-002
    title: Multi-Tenant Structured Store with Audit-Grade History
    summary: One Postgres home for every tenant's structured client data, with bitemporal SCD-2 history and 9-column provenance on every row.
    description: |
      cip_* tables (companies, contacts, deals, tickets, files-metadata) carry
      Tenant-scoped RLS + JSONB overflow + transaction-time + valid-time history.
      Every row knows where it came from, when CIP knew about it, and what its
      authority level is.
    status: shipped
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      GATING PILLAR. The main application connects as postgres (rolsuper, rolbypassrls),
      so RLS does not fence the FAS app path, including /api/v1/cip/search. That is the
      finding that caps this pillar, and cip_176 does not change it.
      CORRECTED 2026-09-04: an earlier draft of this note said "7 tables carry tenant_id
      with no RLS at all". That conflated two counts. 7 tables had no RLS, but only 2 of
      them carried tenant_id (ps_nationality_request_log, ps_readout_editions); the other 5
      are config/global tables that are correctly exempt. Of 82 tenant-scoped tables, 79
      were fenced and 3 were not. cip_176 closed all three, so the enumerative invariant
      now reports 82 of 82. Note FORCE is inert against a BYPASSRLS owner, so the real
      gain there is fencing the non-superuser reader roles on the two previously
      unprotected tables.
      Still open and still gating: 0 of 54 ps_* tables have a two-tenant isolation test,
      and no backup configuration or restore drill exists anywhere.
      Genuine strengths: 175-revision chain with 1 root / 1 head / 0 branches, 0 provenance
      orphans across 148,006 rows, 2.06M SCD history rows, correct SET LOCAL usage.
      Was gold. Measured 2026-09-04.
    created: 2026-04-17
    last_modified: 2026-05-11
    shipped_date: 2026-04-17
    owner: tim
    domain: eng
    audience: [internal-team, agent]
    composed_of_features:
      - structured-store
      - property-registry
      - scd-history
      - tenant-isolation-rls
    value_delivered: Auditable single source of truth — point-in-time queries, full lineage, no hand-rolled schemas per tenant.
    tags: [pillar:structured-store]
    references:
      - id: D-117
        relationship: ratified-by
      - id: D-120
        relationship: implements
      - id: D-123
        relationship: implements
      - id: D-135
        relationship: implements

  - capability_id: CIP-CAP-003
    title: Derived Knowledge from Unstructured Content
    summary: Tickets, notes, documents, and call transcripts become searchable knowledge + queryable graph.
    description: |
      CIP emits KnowledgeText for body-bearing types; Foundry-Agent-System's
      Knowledge subsystem (Pinecone BM25+vector) and Graph subsystem (FalkorDB
      GraphRAG) own the actual storage + retrieval. CIP owns the ingestion
      hook and provenance.
    status: in-progress
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      CONFIRMED bronze, and effectively dormant. Corpus frozen: 36,492 chunks, newest
      2026-05-22, nothing indexed in 3.5 months; the Project Silk tenant has 0 chunks.
      ZERO tests for chunker, indexer, retriever, embedding or reranker. No golden set,
      no recall measurement, no retrieval regression harness. Failed embeddings are
      silently dropped; Pinecone write failures and rerank errors are swallowed. Three
      different embedding_model strings coexist in the corpus. Pure vector, no hybrid.
      knowledge_hook is still an M2 no-op stub. Measured 2026-09-04.
    created: 2026-05-01
    last_modified: 2026-05-12
    owner: tim
    domain: eng
    audience: [internal-team, agent]
    composed_of_features:
      - knowledge-ingestion-hook
    value_delivered: Unstructured client content reaches the same retrieval surfaces agents already use; no separate per-tenant retrieval stack.
    tags: [pillar:unstructured-store]
    references:
      - id: D-117
        relationship: ratified-by
      - id: D-119
        relationship: implements
      - id: D-120
        relationship: implements

  - capability_id: CIP-CAP-004
    title: Multi-Lens Filtered Views (P-21)
    summary: Every data surface serves N consumers with N filter configs; new lens = INSERT-only into cip_views.
    description: |
      Query-time predicate compilation from cip_views.filter_config JSONB
      AND-composed with tenant RLS. Add a new lens by INSERT-only —
      no schema or code change. Golden-file snapshot harness locks
      determinism.
    status: shipped
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      No view-level contract: nothing declares a lens's columns or detects a breaking change.
      cip_154/cip_156 retired 5 views and the tests asserting them were never updated, which
      is 6 of the 13 currently-failing CI tests. docs/LENS-INVENTORY.md lists 57 views against
      92 live. No lens-drift, orphan, or grant-staleness gate in CI.
      Genuine strengths: golden-file snapshot harness, compiler guards (reserved-column
      allow-list, $-prefix rejection, key cap), and 0 of 92 live views missing reader grants.
      Measured 2026-09-04.
    created: 2026-04-30
    last_modified: 2026-05-09
    shipped_date: 2026-04-30
    owner: tim
    domain: eng
    audience: [internal-team, client, agent]
    composed_of_features:
      - lens-engine
      - lens-authoring
      - golden-file-snapshot-harness
    value_delivered: One source of truth, N stakeholder views — partner sees their slice, internal team sees everything, agent sees what its lens permits.
    tags: [pillar:lens-engine]
    references:
      - id: D-117
        relationship: ratified-by
      - id: P-21
        relationship: implements

  - capability_id: CIP-CAP-005
    title: Consumption Surfaces (Dashboards / API / Agent Tools)
    summary: One canonical store; many ways to consume — Metabase dashboards today, REST + MCP coming Phase 4.
    description: |
      M5 shipped Metabase with cip_metabase_role + lens_* grants enforcing P-21
      structurally (REVOKE on cip_*, GRANT only on lens_*). Phase 4 brings
      foundry_mcp_cip_* tools + /cip/* REST. Phase 5 brings a thin conversational
      client (no standalone service, no per-tenant deployment; see D-238).
    status: in-progress
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      CONFIRMED bronze. 3 REST routes + 3 MCP tools + Metabase (still live, verified in
      pg_stat_activity) + an 18-page reports app. No pagination anywhere (caps only; /query
      returns a truncated flag with no cursor). No rate limiting on any CIP route.
      /openapi.json and /docs serve without the internal token. enforce_actor_tenant_authz
      is attached but no-ops: a missing X-Actor-ID returns early and the registry holds
      zero entries (dormant per D-238). /search bypasses cip_query_reader and uses the
      app engine. REST usage
      is stdout-only and unqueryable. Measured 2026-09-04.
    created: 2026-05-09
    last_modified: 2026-09-05
    owner: tim
    domain: eng
    audience: [internal-team, client, agent]
    composed_of_features:
      - metabase-platform-service
      - rest-api-endpoints
      - mcp-tool-surface
    value_delivered: "Pick the right consumer surface per audience: dashboards for humans, APIs for systems, MCP for agents, the thin conversational client for conversational consumption."
    tags: [pillar:consumption-surfaces]
    references:
      - id: D-117
        relationship: ratified-by

  - capability_id: CIP-CAP-006
    title: Push & Sync to External Systems
    summary: Write back from CIP to source-of-truth systems — Chatwoot, partner CRMs, client Google Drive.
    description: |
      Phase 2 lights up the first push surfaces (Chatwoot for support tickets,
      PS Twenty CRM for lead nurture, Google Drive for client artifacts).
      Phase 2.5 adds the authority model (agent_discovered / ingested /
      validated) for write-back governance.
    status: planned
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      CONFIRMED bronze. ZERO outbound writes to any external system; every external call in
      integration_mesh is a pull. crm_companion_writeback is INBOUND despite its name and is
      orphaned (no schedule references it). The governed write path has NEVER committed in
      production: ps_reporting_write_log is 0 rows, and its INSERT shares the business write's
      transaction, so 0 rows means 0 writes. 3 of 13 actions are provably broken by missing
      GRANTs (ps_nationality_request_log, ps_gate_policy, ps_figure_catalog).
      Idempotency is built but inert: the sole client mints a fresh UUID per call.
      No approval gate, no dry-run, no rollback. Measured 2026-09-04.
    created: 2026-05-09
    last_modified: 2026-05-21
    owner: tim
    domain: eng
    audience: [internal-team, client]
    composed_of_features:
      - outbound-push
    value_delivered: CIP closes the loop — not just intelligence in, but governed action out.
    tags: [pillar:push-and-sync]
    references:
      - id: D-117
        relationship: ratified-by

  - capability_id: CIP-CAP-007
    title: Intelligence & Alerts
    summary: Anomaly detection, freshness scoring, proactive signals, scheduled reports.
    description: |
      Phase 6+ lights this up. Ticket spikes, overdue payments, freshness
      crossings → Slack alert channel + Metabase freshness signals +
      scheduled analytical reports. Phase 7 adds investigative agents.
    status: planned
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      CONFIRMED bronze, but for a different reason than assumed. Absence detection GENUINELY
      WORKS: cip_freshness_watchdog reads cip_sync_runs for missing runs and posted to Slack
      104 times across the 2026-09-02 outage (104 of 106 runs, verified), distinguishing dead
      from failing via attempts_in_window=0. What is missing is RESPONSE: no deduplication
      (104 identical messages), no escalation beyond one channel, no runbook link, and no
      auto-recovery, so feeds stayed dead 46h after the code was fixed.
      Readouts: storage shipped, 0 rows, no writer, no tests. Anomaly detection absent.
      ps_feed_registry is seeded-once with a registry/reality mismatch and no gap detection.
      alert_evaluation_sweep auto-disabled 2026-09-02 after ~6 minutes and is still off.
      Measured 2026-09-04.
    created: 2026-05-09
    last_modified: 2026-05-21
    owner: tim
    domain: eng
    audience: [internal-team, client]
    composed_of_features:
      - anomaly-detection
      - readouts
    value_delivered: CIP stops being passive — it surfaces what's worth noticing without operators having to ask.
    tags: [pillar:intelligence-and-alerts]
    references:
      - id: D-117
        relationship: ratified-by

  - capability_id: CIP-CAP-008
    title: Access & Operations
    summary: Multi-tenant isolation (RLS + SET LOCAL), cross-tenant grants, sync-run health, observability.
    description: |
      Tenant isolation is structural — RLS at the table layer + SET LOCAL
      app.current_tenant GUC + explicit tenant_id predicates in lens views.
      Phase 3 adds cross-tenant grants runtime (cip_09 schema + runtime
      ship together). Phase 8 extracts the cip_* tables to a dedicated
      Postgres for scale.
    status: shipped
    maturity: bronze
    maturity_measured: '2026-09-04'
    maturity_evidence: |
      GATING PILLAR. Fails two BRONZE criteria outright. (1) A red build does not block merge:
      master has no branch protection and test.yml has failed 253 consecutive runs with no
      success since 2026-05-10. (2) No secret scanner runs anywhere: gitleaks is configured
      but pre-commit is not installed, it is absent from CI, and GitHub secret scanning is
      disabled on the repo. Also: 7 role migrations fall back to a literal sentinel password
      with no prod guard in a public repo; 2 CodeQL error-severity alerts unremediated ~7 weeks;
      no metrics/tracing/structured logging in cip/; incident-response doc is a 38-line stub
      never filled across 9 incidents; MIGRATION-RUNBOOK is 164 migrations out of date;
      no backup or restore drill. Was silver. Measured 2026-09-04.
    created: 2026-04-17
    last_modified: 2026-04-30
    shipped_date: 2026-04-17
    owner: tim
    domain: eng
    audience: [internal-team, agent]
    composed_of_features:
      - tenant-isolation-rls
      - cross-tenant-grants
    value_delivered: Every query carries tenant scoping by construction — no class of "leaked across tenants" bug possible at the data layer.
    tags: [pillar:access-and-operations]
    references:
      - id: D-117
        relationship: ratified-by
      - id: D-026
        relationship: implements
